<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Ian Seremet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Mono', monospace;
            background-color: #2a2a2a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            margin-bottom: 30px;
            color: #9CBA7F;
        }

        .login-container input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 1em;
            background-color: #333;
            color: #fff;
        }

        .login-container input:focus {
            outline: none;
            border: 2px solid #9CBA7F;
        }

        .login-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        .login-container button:hover {
            background-color: #45a049;
        }

        .login-container .icon {
            font-size: 2em;
            margin-bottom: 15px;
            color: #9CBA7F;
        }

        .error {
            color: #ff6961;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon"><i class="fas fa-toolbox"></i></div>
        <h2>Ian's Toolbox</h2>
        <form onsubmit="return validateLogin(event)">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
            <p id="errorMsg" class="error">Invalid email or password.</p>
        </form>
    </div>

    <script>
        function validateLogin(event) {
            event.preventDefault(); // prevent form submission
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const correctEmail = "ian.seremet@gmail.com";
            const correctPassword = "Luckyiscool101!";

            if (email === correctEmail && password === correctPassword) {
                window.location.href = "app.html"; // redirect on success
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
